# OWASP ZAP baseline scan — runs when STAGING_URL secret is set.
name: ZAP Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - name: Require staging URL
        id: gate
        run: |
          if [ -z "${{ secrets.STAGING_URL }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_URL secret not set — skipping ZAP until staging is available."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "target=${{ secrets.STAGING_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: ZAP Baseline Scan
        if: steps.gate.outputs.skip != 'true'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.gate.outputs.target }}
          fail_action: false
          allow_issue_writing: false
